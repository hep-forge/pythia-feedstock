{% set versions = {
    "8.3.12": "c1a33aa5fa15e6b70d7946ce6d237246842887ec84ea0b35dfc2535c868a2770"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

# PYTHIA 8 comes from conda-forge's pythia8. This package only points
# "pythia" at it, so recipes and users can keep asking for "pythia":
# major 8 here (main label), major 6 is still compiled on the legacy branch.
# conda-forge spells 8.3.12 as 8.312.
{% set _v = version.split('.') %}
{% set cf_version = _v[0] ~ '.' ~ _v[1] ~ '%02d'|format(_v[2]|int) %}

{% set name = environ.get('ANACONDA_PACKAGE', "pythia")|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

build:
  number: 1   # above the compiled 8.3.12 build 0 still on the channel
  noarch: generic
  # Consumers link conda-forge's libpythia8; give them its own pin.
  run_exports:
    - pythia8 >={{ cf_version }},<8.400.0a0

requirements:
  run:
    - pythia8 {{ cf_version }}.*

test:
  commands:
    - pythia8-config --version
    - test "$(pythia8-config --version)" = "{{ cf_version }}"

about:
  home: "https://pythia.org"
  license: "GPL-3.0-or-later"
  summary: "PYTHIA 8 event generator, from conda-forge's pythia8 (major 6 is on the legacy label)"
  description: |
    hep-forge no longer compiles PYTHIA 8. This package installs
    conda-forge's pythia8 of the same version, which is also the build
    conda-forge's ROOT links. PYTHIA 6 is still built here, on the legacy
    branch/label.

extra:
  recipe-maintainers:
    - meiyasan
